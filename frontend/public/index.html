<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Enhanced SEO Meta Tags -->
    <meta name="description" content="Browse and sell textbooks, electronics, clothing, services and student essentials across supported campuses on Campus Cart." />
    <meta name="keywords" content="Campus Cart, varsity marketplace, student marketplace, buy textbooks, sell textbooks, student essentials, campus deals" />
    <meta name="author" content="LBG Software" />
    
    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:title" content="Campus Cart - The Marketplace for Varsity Students" />
    <meta property="og:description" content="Buy and sell textbooks, stationery, and student essentials at the official Campus Cart." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marketplace.lbgsoftware.co.za/" />
    <meta property="og:site_name" content="Campus Cart" />
    <meta property="og:image" content="https://marketplace.lbgsoftware.co.za/campus-cart-logo.png" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Campus Cart - The Marketplace for Varsity Students" />
    <meta name="twitter:description" content="Buy and sell textbooks, stationery, and student essentials at the official Campus Cart." />
    <meta name="twitter:image" content="https://marketplace.lbgsoftware.co.za/campus-cart-logo.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://marketplace.lbgsoftware.co.za/" />
    
    <!-- Prevent iOS from scaling text -->
    <meta name="format-detection" content="telephone=no" />
    
    <link rel="icon" href="%PUBLIC_URL%/campus-cart.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/campus-cart.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Enhanced Title with Keywords -->
    <title>Campus Cart | The Marketplace for Varsity Students</title>
    
    <!-- Structured Data for Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Campus Cart",
      "alternateName": "Campus Cart Marketplace",
      "url": "https://marketplace.lbgsoftware.co.za/",
      "description": "A student marketplace for browsing and selling textbooks, electronics, clothing, services and essentials across supported campuses.",
      "publisher": {
        "@type": "Organization",
        "name": "LBG Software",
        "url": "https://www.lbgsoftware.co.za"
      }
    }
    </script>
    
    <style>
      /* Ensure proper scaling on all devices */
      html {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      
      body {
        margin: 0;
        padding: 0;
        min-width: 320px;
        overflow-x: hidden;
      }
      
      /* Loading spinner */
      #root-loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background-color: #f9fafb;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
  
      
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <div id="root">
      <div id="root-loading">
        <div class="spinner"></div>
      </div>
    </div>

  </body>
</html>
